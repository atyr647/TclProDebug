name: Starpacks

# Builds single-file TclProDebug executables for Linux, Windows and macOS,
# tests each one on its own platform, and (for tags named v*) publishes them as
# a *draft* GitHub release that a person must review and publish.  See
# packaging/README.md.

on:
  # No "paths" filter on push: GitHub applies it to tag pushes too, and a tag
  # that points at an already-pushed commit has no changed files, so a release
  # tag would silently build nothing.
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    paths:
      - 'lib/**'
      - 'src/**'
      - 'main.tcl'
      - 'starkit.manifest'
      - 'packaging/**'
      - '.github/workflows/starpack.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch supersedes an older, still-running build.
concurrency:
  group: starpacks-${{ github.ref }}
  cancel-in-progress: true

env:
  # KitCreator is pinned to an exact commit so builds are reproducible.
  KITCREATOR_REF: dc14b6f1f0ac82d4a694b6dba0187fceaec668b1
  # Tcl/Tk 9 is only used as a *debuggee* in the tests, to prove that the
  # packaged debugger can debug Tk 9 programs.
  TCL9_VERSION: 9.0.1
  TCL9_SHA256: a72b1607d7a399c75148c80fcdead88ed3371a29884181f200f2200cdee33bbc
  TK9_SHA256: d6f01a4d598bfc6398be9584e1bab828c907b0758db4bbb351a1429106aec527

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-22.04      # oldest glibc we can get: widest compatibility
          - target: windows-x86_64
            os: ubuntu-22.04      # cross-compiled with mingw-w64, tested on Windows below
          - target: macos-arm64
            os: macos-15          # Apple Silicon; older SDK than macos-latest, shorter queue
          - target: macos-x86_64
            os: macos-15-intel
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: rkeene/kitcreator
          ref: ${{ env.KITCREATOR_REF }}
          path: .kitcreator

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf build-essential tcl zip \
            libx11-dev libxft-dev libxext-dev libxss-dev libfontconfig1-dev \
            xvfb tcl8.6 tk8.6
          if [ "${{ matrix.target }}" = windows-x86_64 ]; then
            sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
          fi

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install autoconf

      - name: Build
        run: packaging/build-starpack.sh ${{ matrix.target }}

      # ---- Tests: only where the binary can run on the build machine ----

      - name: Self-test (Linux)
        if: matrix.target == 'linux-x86_64'
        run: |
          exe="$PWD/dist/TclProDebug-linux-x86_64"
          for interp in tclsh8.6 wish8.6; do
            xvfb-run -a "$exe" --selftest "$PWD/report-$interp.txt" "$(command -v $interp)"
          done
          # ...and debugging with the executable's own built-in Tcl/Tk.
          xvfb-run -a "$exe" --selftest "$PWD/report-self.txt" self
          grep -q 'debug session in .*TclProDebug' report-self.txt

      - name: Restore Tcl/Tk 9 (debuggee)
        if: matrix.target == 'linux-x86_64'
        id: tcl9cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/tcl9
          key: tcl-tk-${{ env.TCL9_VERSION }}-${{ runner.os }}-1

      - name: Build Tcl/Tk 9 (debuggee)
        if: matrix.target == 'linux-x86_64' && steps.tcl9cache.outputs.cache-hit != 'true'
        run: |
          cd "$RUNNER_TEMP"
          v=${TCL9_VERSION}
          curl -fsSLO "https://prdownloads.sourceforge.net/tcl/tcl$v-src.tar.gz"
          curl -fsSLO "https://prdownloads.sourceforge.net/tcl/tk$v-src.tar.gz"
          echo "$TCL9_SHA256  tcl$v-src.tar.gz" | sha256sum -c -
          echo "$TK9_SHA256  tk$v-src.tar.gz" | sha256sum -c -
          tar xzf tcl$v-src.tar.gz && tar xzf tk$v-src.tar.gz
          (cd tcl$v/unix && ./configure --prefix="$HOME/tcl9" && make -j"$(nproc)" && make install)
          (cd tk$v/unix && ./configure --prefix="$HOME/tcl9" --with-tcl="$RUNNER_TEMP/tcl$v/unix" && make -j"$(nproc)" && make install)

      - name: Self-test, debugging a Tk 9 program (Linux)
        if: matrix.target == 'linux-x86_64'
        run: |
          # This is the scenario from the original bug report: the debugger
          # running a program that loads Tk 9.
          xvfb-run -a "$PWD/dist/TclProDebug-linux-x86_64" \
            --selftest "$PWD/report-tcl9.txt" "$HOME/tcl9/bin/tclsh9.0"
          grep -q 'tcl=9\.' report-tcl9.txt
          grep -q 'tk=1' report-tcl9.txt

      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install tcl-tk tcl-tk@8
          exe="$PWD/dist/TclProDebug-${{ matrix.target }}"
          "$exe" --selftest "$PWD/report.txt" self
          grep -q 'debug session in .*TclProDebug' report.txt
          # Homebrew's current Tcl/Tk 9 (the version number changes over time).
          tcl8="$(brew --prefix tcl-tk@8)/bin/tclsh8.6"
          tcl9="$(ls "$(brew --prefix tcl-tk)"/bin/tclsh9* | head -n 1)"
          echo "Tcl 8 debuggee: $tcl8"; echo "Tcl 9 debuggee: $tcl9"
          "$exe" --selftest "$PWD/report-tcl8.txt" "$tcl8"
          "$exe" --selftest "$PWD/report-tcl9.txt" "$tcl9"
          grep -q 'tcl=8\.' report-tcl8.txt
          grep -q 'tcl=9\.' report-tcl9.txt
          grep -q 'tk=1' report-tcl9.txt

      - name: Package
        run: |
          cd dist
          name="TclProDebug-${{ matrix.target }}"
          if [ "${{ matrix.target }}" = windows-x86_64 ]; then
            zip -9 "$name.zip" "$name.exe"
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          ls -l

      - name: Show test reports
        if: always()
        run: for f in report*.txt; do echo "=== $f"; cat "$f"; done
        continue-on-error: true

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: starpack-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  test-windows:
    name: test (windows-x86_64)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: starpack-windows-x86_64

      - name: Self-test (the executable's own Tcl/Tk)
        shell: pwsh
        run: |
          Expand-Archive TclProDebug-windows-x86_64.zip -DestinationPath .
          $p = Start-Process -FilePath .\TclProDebug-windows-x86_64.exe `
                 -ArgumentList '--selftest', "$PWD\report-self.txt", 'self' -Wait -PassThru
          if (Test-Path report-self.txt) { Get-Content report-self.txt }
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
          if (-not (Select-String -Path report-self.txt -Pattern 'RESULT: PASSED' -Quiet)) { throw 'no PASSED marker' }
          if (-not (Select-String -Path report-self.txt -Pattern 'debug session in' -Quiet)) { throw 'no debug session was run' }

      # The scenario from the original bug report, on Windows: debug a Tk 9
      # program with an external Tcl/Tk 9 interpreter.  No Tcl is installed on the
      # runner, so build one (cached).
      - name: Restore Tcl/Tk 9 (debuggee)
        id: tcl9cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: C:\tcl9win
          key: tcl-tk-${{ env.TCL9_VERSION }}-Windows-1

      - name: Set up MSYS2 (to build Tcl/Tk 9)
        if: steps.tcl9cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            make
            zip

      - name: Build Tcl/Tk 9 (debuggee)
        if: steps.tcl9cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          set -e
          cd /tmp
          v="${TCL9_VERSION}"
          curl -fsSLO "https://prdownloads.sourceforge.net/tcl/tcl$v-src.tar.gz"
          curl -fsSLO "https://prdownloads.sourceforge.net/tcl/tk$v-src.tar.gz"
          echo "${TCL9_SHA256}  tcl$v-src.tar.gz" | sha256sum -c -
          echo "${TK9_SHA256}  tk$v-src.tar.gz" | sha256sum -c -
          tar xzf tcl$v-src.tar.gz && tar xzf tk$v-src.tar.gz
          (cd tcl$v/win && ./configure --prefix=/c/tcl9win && make -j"$(nproc)" && make install)
          (cd tk$v/win && ./configure --prefix=/c/tcl9win --with-tcl=/tmp/tcl$v/win && make -j"$(nproc)" && make install)

      - name: Self-test, debugging a Tk 9 program (Windows)
        shell: pwsh
        run: |
          $tclsh = 'C:\tcl9win\bin\tclsh90.exe'
          if (-not (Test-Path $tclsh)) { throw "$tclsh was not built" }
          $p = Start-Process -FilePath .\TclProDebug-windows-x86_64.exe `
                 -ArgumentList '--selftest', "$PWD\report-tcl9.txt", $tclsh -Wait -PassThru
          if (Test-Path report-tcl9.txt) { Get-Content report-tcl9.txt }
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
          if (-not (Select-String -Path report-tcl9.txt -Pattern 'RESULT: PASSED' -Quiet)) { throw 'no PASSED marker' }
          if (-not (Select-String -Path report-tcl9.txt -Pattern 'tcl=9\.' -Quiet)) { throw 'the debuggee was not Tcl 9' }
          if (-not (Select-String -Path report-tcl9.txt -Pattern 'tk=1' -Quiet)) { throw 'Tk 9 was not loaded by the debuggee' }

  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test-windows]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: starpack-*
          merge-multiple: true
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum TclProDebug-* > SHA256SUMS
          cat SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --draft --title "TclProDebug $GITHUB_REF_NAME" --generate-notes \
            TclProDebug-* SHA256SUMS
